name: cd

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '*.md'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy to remote server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check secrets configuration
        id: check_secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::notice ::SERVER_HOST is not configured in GitHub Secrets. Skipping automated remote CD."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "SERVER_HOST is set (${{ secrets.SERVER_HOST }})."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: wait for CI (image build) of this exact commit
        if: steps.check_secrets.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # The deploy pulls ghcr.io/:latest, which CI's docker job pushes for
          # this same commit. Both workflows start on the same push, so CD
          # used to race CI and pull the PREVIOUS image while reporting
          # success (production incident 2026-10-27: a stale binary ran for
          # ~a day). Wait for the CI run of this exact SHA, bounded.
          set -eu
          for i in $(seq 1 60); do
            run_id=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&workflow=ci.yml" --jq '.workflow_runs[0].id' 2>/dev/null || true)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.status + "/" + (.conclusion // "pending")')
              echo "CI run $run_id: $status (attempt $i/60)"
              case "$status" in
                completed/success)
                  echo "CI succeeded for $SHA - the image is current. Proceeding."
                  exit 0
                  ;;
                completed/*)
                  echo "::error ::CI for $SHA finished with $status - refusing to deploy."
                  exit 1
                  ;;
              esac
            else
              echo "no CI run found for $SHA yet (attempt $i/60)"
            fi
            sleep 30
          done
          echo "::error ::timed out waiting for CI of $SHA - refusing to deploy an unverified image."
          exit 1

      - name: execute remote deployment via ssh
        if: steps.check_secrets.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMINS: ${{ secrets.TELEGRAM_ADMINS }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URL: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URL }}
          TELEMEETBOT_PROXY: ${{ secrets.TELEMEETBOT_PROXY }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: TELEGRAM_TOKEN,TELEGRAM_ADMINS,TELEGRAM_API_ID,TELEGRAM_API_HASH,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,GOOGLE_OAUTH_REDIRECT_URL,TELEMEETBOT_PROXY,APP_DOMAIN
          script_stop: true
          script: |
            set -eu
            echo "==> Connected to server $(hostname) via GitHub Actions CD"
            if [ -f "/root/TeleMeetBot/scripts/remote-deploy.sh" ]; then
              cd /root/TeleMeetBot && git pull origin main 2>/dev/null || true
              /root/TeleMeetBot/scripts/remote-deploy.sh
            else
              mkdir -p /tmp/tmb-cd
              curl -fsSL "https://raw.githubusercontent.com/Opselon/TeleMeetBot-TeleMeetBot-implementation/main/scripts/remote-deploy.sh" -o /tmp/tmb-cd/remote-deploy.sh
              chmod +x /tmp/tmb-cd/remote-deploy.sh
              /tmp/tmb-cd/remote-deploy.sh
              rm -rf /tmp/tmb-cd
            fi

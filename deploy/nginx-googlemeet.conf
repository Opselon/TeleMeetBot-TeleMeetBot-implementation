# Nginx Reverse Proxy Configuration for TeleMeetBot (Google Meet Bot)
# Maps public HTTPS (e.g. https://googlemeet.example.com) to TeleMeetBot port 18080.
# Handles OAuth 2.0 callbacks (/auth/google/callback) and health probes (/healthz, /livez).

server {
    listen 80;
    server_name googlemeet.example.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name googlemeet.example.com;

    ssl_certificate /etc/letsencrypt/live/googlemeet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/googlemeet.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy all traffic to TeleMeetBot container
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for realtime events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
